# Checks for every pull request to main. The job names (lint, test, build) are the status checks
# that the branch ruleset requires before merging.
name: pull-request

on:
  pull_request:
    branches: [main]

# The token can read the code and nothing else; no AWS access on pull requests.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is now outdated.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Builds the production image without pushing it: a broken Dockerfile fails the pull request.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: katas-web:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
