apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: katas-web
  labels:
    app.kubernetes.io/name: katas-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: katas-web
  # Two at least: one pod can be drained or restarted while the other serves.
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Utilization is measured against the CPU request, which is why the request is mandatory.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Waits 5 minutes of lower load before removing pods, so a short dip does not flap.
      stabilizationWindowSeconds: 300
