# External Secrets Operator: reads the value from AWS Secrets Manager and keeps the Kubernetes Secret
# `katas-web-secrets` in sync. Requires the operator and a ClusterSecretStore named aws-secrets-manager
# (with IRSA or EKS Pod Identity credentials). Use it instead of secret.example.yaml, never both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: katas-web-secrets
  labels:
    app.kubernetes.io/name: katas-web
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: katas-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: katas/prod/app-database
        property: password
