# Local clusters only (kind, minikube). A Secret is base64-encoded, not encrypted: never commit a real
# value. In a shared cluster, external-secret.yaml creates this same Secret from AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: katas-web-secrets
  labels:
    app.kubernetes.io/name: katas-web
type: Opaque
stringData:
  database-password: replace-with-a-local-password
