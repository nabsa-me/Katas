name: auth-sso

services:
  # Local OpenID Connect provider for the katas. It accepts any client and redirect URI, shows a login
  # form (any username works) and signs real RS256 tokens published at /katas/jwks.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.2
    ports:
      - '5806:8080'
    environment:
      SERVER_PORT: '8080'
      # Issuer id `katas` → issuer http://localhost:5806/katas (the host part comes from the request).
      # The token callback matches the username typed in the login form (`subject`) and adds claims:
      # `ada` is in the admins group, `grace` only in the readers group. A real provider would issue the
      # ID token for the web client and the access token for the API; this mock puts the same `aud` list
      # in both, so it names the web client (`katas-web`) and the demo API (`katas-api`). With more than
      # one audience, OpenID Connect requires `azp` (authorized party) to name the client the ID token
      # was issued to, and openid-client rejects the ID token without it.
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "katas",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "subject",
                  "match": "ada",
                  "claims": {
                    "sub": "ada",
                    "aud": ["katas-web", "katas-api"],
                    "azp": "katas-web",
                    "name": "Ada Lovelace",
                    "groups": ["katas-admins"]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "grace",
                  "claims": {
                    "sub": "grace",
                    "aud": ["katas-web", "katas-api"],
                    "azp": "katas-web",
                    "name": "Grace Hopper",
                    "groups": ["katas-readers"]
                  }
                }
              ]
            }
          ]
        }
    healthcheck:
      # The image ships BusyBox wget; the discovery document answers once the server is up.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/katas/.well-known/openid-configuration']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
